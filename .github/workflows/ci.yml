name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - run: vendor/bin/phpcs --standard=.phpcs.xml.dist

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=4G

  test:
    name: PHPUnit ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: convoca_test
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          extensions: imagick, gd, mysqli
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - name: Instalar gettext (msgfmt, del contrato de traducciones)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext
      - name: Create build directory
        run: mkdir -p build
      - name: Run unit tests
        run: vendor/bin/phpunit -c phpunit-unit.xml --log-junit build/junit.xml
      - name: Traer el nucleo (dependencia real, como en produccion)
        # El plugin exige Convoca Core activo y sus pruebas necesitan el CPT y las tablas del nucleo.
        # Se instala SIN dependencias de desarrollo: con ellas, el PHPUnit del nucleo (10.x) se mezcla
        # con el del plugin (9.6, que es lo que necesita wp-phpunit) y el arranque revienta.
        run: |
          git clone --depth 1 https://github.com/josecarlosnieto91/convoca-core.git ../convoca-core
          ( cd ../convoca-core && composer update --no-dev --no-interaction --ignore-platform-req=ext-iconv )

      - name: Montar el entorno de pruebas de WordPress
        # Antes esta suite saltaba los 39 tests (0 aserciones) y el job lo leia como exito. El script
        # deja WordPress + la biblioteca de pruebas de la version etiquetada + el wp-tests-config, y
        # tests/bootstrap.php ejecuta la activacion del plugin (que es donde se crean sus tablas).
        env:
          DB_NAME: wordpress_test
          DB_USER: root
          DB_PASSWORD: convoca_test
          DB_HOST: 127.0.0.1:3306
          CONVOCA_CORE_DIR: ../convoca-core
        run: |
          mysql -h 127.0.0.1 -uroot -pconvoca_test -e 'CREATE DATABASE IF NOT EXISTS wordpress_test;'
          bash bin/instalar-entorno-pruebas.sh /tmp/entorno

      - name: Run integration tests
        env:
          CONVOCA_WP_ROOT: /tmp/entorno/wp
          WP_PHPUNIT__TESTS_CONFIG: /tmp/entorno/wp-tests-config.php
          WP_TESTS_DIR: /tmp/entorno/wptests
        run: vendor/bin/phpunit -c phpunit-integration.xml --log-junit build/junit-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-report-${{ matrix.php }}
          path: build/

  plugin-check:
    name: Plugin Check (PCP · version fijada y cacheada)
    runs-on: ubuntu-latest
    env:
      # Versiones FIJADAS a proposito (issue convoca-members#11). Al subirlas hay que volver a medir.
      WP_VERSION: '7.1.3'
      PLUGIN_CHECK_VERSION: '2.1.0'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, wp-cli
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - name: Build clean plugin dir (as published)
        # Replica el paquete de distribución: excluye tooling dev (.distignore)
        # y archivos ocultos/prohibidos (.htaccess). vendor viaja (wp.org no
        # ejecuta composer y PCP activa el plugin en wp-env).
        run: |
          mkdir -p build-dir
          rsync -a --exclude-from=.distignore ./ build-dir/convoca-enroll/
          cp -r vendor build-dir/convoca-enroll/
          find build-dir/convoca-enroll -name '.htaccess' -delete
          # Quitar 'Requires Plugins' SOLO en el build-dir: la action de PCP
          # ejecuta 'wp plugin install <dep>' contra wp.org, y convoca-core aún
          # no está publicado. El header real del repo se mantiene (wp.org lo
          # auditará cuando core esté publicado también).
          sed -i '/Requires Plugins:/d' build-dir/convoca-enroll/convoca-enroll.php
          ls build-dir/convoca-enroll/
      - name: Traer las piezas fijadas (WordPress y Plugin Check), con cache
        # La cache guarda SOLO los dos zip. Antes guardaba ademas el WordPress ya descomprimido y el segundo
        # run pedia confirmacion para sobrescribirlo ("replace ... [y]es, [n]o, [A]ll, [N]one"), que en el CI
        # sin terminal es un fallo: unzip preguntaba y moria con EOF. Se cachea lo que hay que traer de la red,
        # no el resultado de usarlo.
        id: piezas
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pcp-archivos
          key: pcp2-wp${{ env.WP_VERSION }}-plugincheck${{ env.PLUGIN_CHECK_VERSION }}

      - name: Descargar las piezas (solo si no estan en cache)
        if: steps.piezas.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pcp-archivos"
          traer() {
            if ! curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o "$2" "$1"; then
              echo "::error title=Infraestructura, no el repositorio::No se pudo traer $1. Este rojo NO dice nada del codigo."
              exit 1
            fi
          }
          traer "https://wordpress.org/wordpress-${WP_VERSION}.zip" "$RUNNER_TEMP/pcp-archivos/wordpress.zip"
          traer "https://downloads.wordpress.org/plugin/plugin-check.${PLUGIN_CHECK_VERSION}.zip" "$RUNNER_TEMP/pcp-archivos/plugin-check.zip"

      - name: Preparar el WordPress de pruebas
        run: |
          mkdir -p "$RUNNER_TEMP/wp"
          unzip -oq "$RUNNER_TEMP/pcp-archivos/wordpress.zip" -d "$RUNNER_TEMP/wp"
          cp -r build-dir/convoca-enroll "$RUNNER_TEMP/wp/wordpress/wp-content/plugins/convoca-enroll"
          wp config create --path="$RUNNER_TEMP/wp/wordpress" --dbname=wordpress \
            --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path="$RUNNER_TEMP/wp/wordpress" --url=http://localhost:8880 \
            --title=Convoca --admin_user=admin --admin_password=NoEsUnSecreto123 \
            --admin_email=ci@example.org --skip-email

      - name: Run Plugin Check (WordPress.org, version fijada)
        run: |
          wp plugin install "$RUNNER_TEMP/pcp-archivos/plugin-check.zip" --activate --path="$RUNNER_TEMP/wp/wordpress"
          wp plugin activate convoca-enroll --path="$RUNNER_TEMP/wp/wordpress"
          wp plugin check convoca-enroll \
            --path="$RUNNER_TEMP/wp/wordpress" \
            --categories=plugin_repo,security \
            --ignore-warnings=true

  phpunit-summary:
    name: PHPUnit Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: echo "All PHPUnit runs completed."
