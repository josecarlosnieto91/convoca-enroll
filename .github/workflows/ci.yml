name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - run: vendor/bin/phpcs --standard=.phpcs.xml.dist

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=4G

  test:
    name: PHPUnit ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: convoca_test
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          extensions: imagick, gd, mysqli
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - name: Create build directory
        run: mkdir -p build
      - name: Run unit tests
        run: vendor/bin/phpunit -c phpunit-unit.xml --log-junit build/junit.xml
      - name: Traer el nucleo (dependencia real, como en produccion)
        # El plugin exige Convoca Core activo y sus pruebas necesitan el CPT y las tablas del nucleo.
        # Se instala SIN dependencias de desarrollo: con ellas, el PHPUnit del nucleo (10.x) se mezcla
        # con el del plugin (9.6, que es lo que necesita wp-phpunit) y el arranque revienta.
        run: |
          git clone --depth 1 https://github.com/josecarlosnieto91/convoca-core.git ../convoca-core
          ( cd ../convoca-core && composer update --no-dev --no-interaction --ignore-platform-req=ext-iconv )

      - name: Montar el entorno de pruebas de WordPress
        # Antes esta suite saltaba los 39 tests (0 aserciones) y el job lo leia como exito. El script
        # deja WordPress + la biblioteca de pruebas de la version etiquetada + el wp-tests-config, y
        # tests/bootstrap.php ejecuta la activacion del plugin (que es donde se crean sus tablas).
        env:
          DB_NAME: wordpress_test
          DB_USER: root
          DB_PASSWORD: convoca_test
          DB_HOST: 127.0.0.1:3306
          CONVOCA_CORE_DIR: ../convoca-core
        run: |
          mysql -h 127.0.0.1 -uroot -pconvoca_test -e 'CREATE DATABASE IF NOT EXISTS wordpress_test;'
          bash bin/instalar-entorno-pruebas.sh /tmp/entorno

      - name: Run integration tests
        env:
          CONVOCA_WP_ROOT: /tmp/entorno/wp
          WP_PHPUNIT__TESTS_CONFIG: /tmp/entorno/wp-tests-config.php
          WP_TESTS_DIR: /tmp/entorno/wptests
        run: vendor/bin/phpunit -c phpunit-integration.xml --log-junit build/junit-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-report-${{ matrix.php }}
          path: build/

  plugin-check:
    name: Plugin Check (PCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - name: Build clean plugin dir (as published)
        # Replica el paquete de distribución: excluye tooling dev (.distignore)
        # y archivos ocultos/prohibidos (.htaccess). vendor viaja (wp.org no
        # ejecuta composer y PCP activa el plugin en wp-env).
        run: |
          mkdir -p build-dir
          rsync -a --exclude-from=.distignore ./ build-dir/convoca-enroll/
          cp -r vendor build-dir/convoca-enroll/
          find build-dir/convoca-enroll -name '.htaccess' -delete
          # Quitar 'Requires Plugins' SOLO en el build-dir: la action de PCP
          # ejecuta 'wp plugin install <dep>' contra wp.org, y convoca-core aún
          # no está publicado. El header real del repo se mantiene (wp.org lo
          # auditará cuando core esté publicado también).
          sed -i '/Requires Plugins:/d' build-dir/convoca-enroll/convoca-enroll.php
          ls build-dir/convoca-enroll/
      - name: Run Plugin Check (WordPress.org)
        # Ejecuta Plugin Check (PCP) en categorías plugin_repo + security,
        # bloqueantes para publicar en WordPress.org. Los warnings no fallan;
        # cualquier ERROR sí (exit != 0).
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build-dir/convoca-enroll'
          categories: |
            plugin_repo
            security
          ignore-warnings: 'true'
          wp-version: latest

  phpunit-summary:
    name: PHPUnit Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: echo "All PHPUnit runs completed."
